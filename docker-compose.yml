# 只需保存此文件，再执行 docker compose up -d；无需下载源码或本地构建。
services:
  ocrread:
    image: ghcr.io/edwinzzzs2/ocrread:${OCRREAD_TAG:-latest}
    container_name: ocrread
    restart: unless-stopped
    ports:
      - "${DDDDOCR_PORT:-8000}:8000"
    mem_limit: ${DDDDOCR_MEMORY_LIMIT:-640m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
